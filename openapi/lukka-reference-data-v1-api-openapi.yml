        entity_asset_one_name

        CHARACTER

        256

        Base asset name of the pair provided by the source entity


        entity_asset_one_internal_id

        CHARACTER

        256

        Internal code provided by the source entity to uniquely identify the base asset


        entity_asset_two_code

        CHARACTER

        256

        Counter asset code (ticker) of the pair provided by the source entity


