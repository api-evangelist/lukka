        entity_asset_two_internal_id

        CHARACTER

        256

        Internal code provided by the source entity to uniquely identify the counter asset


        entity_price_precision

        NUMERIC


        Fixed number of decimal places to which the price is rounded off by the source entity


        entity_quantity_precision

        NUMERIC


        Fixed number of decimal places to which the quantity traded is rounded off by the source entity


        entity_minimum_tick_size

        NUMERIC


        Smallest price increment in which the source entity prices are quoted


