  /v2/lukka/assets/LA6EV2NKQ95/crypto-actions:
    get:
      operationId: assetCryptoActions
      summary: Asset Crypto Actions
      tags:
      - Reference Data - Crypto Actions
      description: "Provides crypto action information for a given Lukka ID from the Lukka Crypto Actions (\"LCA\") data product\n\n Lukka Crypto Actions is a detailed and comprehensive treatment methodology currently consisting of over 25 Crypto Action Event Types with the purpose of providing firms with data around changes to asset structure and asset characteristics within the digital asset landscape, including structured metadata pertaining to what attributes have changed with an asset, on what date, and as a result of what event.\n\n Market events that have material impact on digital assets or are determined by Lukka to be significant in nature are eligible for induction into the asset’s crypto action history repository. Generally speaking, material impacts revolve around events that affect either an asset’s protocol structure, characteristics, or reporting in the marketplace. The LCA event types are described in detail in the Structure and Definitions section of this document."
      parameters:
      - name: domain
        in: query
        required: false
        schema:
          type: string
        example: assets
      responses:
        '200':
          description: Asset Crypto Actions
          content:
            application/json:
              example:
                offset: 0
                limit: 500
                size: 2
                links:
                  base: /v2/lukka/assets/LA2EYFUQT32/crypto-actions
                  next: null
                  prev: null
                data:
                - assetLid: LA2EYFUQT32
                  currentWhitepaperCode: AAVE
                  currentName: Aave Token
                  lukkaCryptoActionParentId: e2fbbc5e-b8b7-468f-a67d-7270cdbfe83b
                  lukkaCryptoActionId: a5fa7ef9-849a-48ab-a1a5-817db43dea73
                  announceTime: '2020-12-03T21:20:00Z'
                  effectiveTime: '2020-09-24T18:06:28Z'
                  lukkaCryptoActionCode: ASLH
                  lukkaCryptoActionName: Asset Launch
                  eventName: null
                  eventDescription: Aave Token (AAVE) Asset Launch
                  eventUrl: https://etherscan.io/tx/0xfd5f0c65fdea26d0b94362532554d4c6cb4935b198d75e1cc07c7df4bfd8d1ad
                  announceUrl: https://twitter.com/AaveAave/status/1334608524672962561
                  recordNote: Aave V2 completed formal verification by  @CertoraInc , as well
                  isFutureEvent: false
                - assetLid: LA2EYFUQT32
                  currentWhitepaperCode: AAVE
                  currentName: Aave Token
                  lukkaCryptoActionParentId: 6e8903f5-2b13-4342-b174-b229df9fd906
                  lukkaCryptoActionId: 493557a2-5260-4d9f-a22e-37c0af0202ba
                  announceTime: null
                  effectiveTime: '2020-07-22T00:00:00Z'
                  lukkaCryptoActionCode: CADTR
