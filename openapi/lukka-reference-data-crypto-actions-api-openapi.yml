openapi: 3.2.0
info:
  title: Lukka Reference Data Reference Data - Crypto Actions API
  version: 1.0.0
  description: 'The golden copy of crypto asset reference data: normalised assets, entities, marketplaces, custodians, VASPs, asset/pair/derivative cross-reference mappings, crypto actions, LDACS sectors, core asset scores, ESG scores and prediction markets.'
  contact:
    name: Lukka Support
    url: https://lukka.tech/support/
  x-origin:
  - format: postman
    version: 2.1.0
    url: https://apidocs.lukka.tech/
servers:
- url: https://data-refdata-api.lukka.tech
  description: Lukka production (data-refdata-api.lukka.tech)
security:
- bearerAuth: []
tags:
- name: Reference Data - Crypto Actions
paths:
  /v2/lukka/assets/crypto-actions:
    get:
      operationId: allCryptoActions
      summary: All Crypto Actions
      tags:
      - Reference Data - Crypto Actions
      description: "The Crypto Actions endpoint contains information related to the Lukka Crypto Actions (“LCA”) data product  \n\n Lukka Crypto Actions is a detailed and comprehensive treatment methodology currently consisting of over 25 Crypto Action Event Types with the purpose of providing firms with data around changes to asset structure and asset characteristics within the digital asset landscape, including structured metadata pertaining to what attributes have changed with an asset, on what date, and as a result of what event.\n\n Market events that have material impact on digital assets or are determined by Lukka to be significant in nature are eligible for induction into the asset’s crypto action history repository. Generally speaking, material impacts revolve around events that affect either an asset’s protocol structure, characteristics, or reporting in the marketplace. The LCA event types are described in detail in the Structure and Definitions section of this document."
      parameters:
      - name: limit
        in: query
        required: false
        schema:
          type: string
        example: '10'
      - name: offset
        in: query
        required: false
        schema:
          type: string
        example: '0'
      - name: lukkaCryptoActionIds
        in: query
        required: false
        schema:
          type: string
        example: 6286a369-8d8c-425a-8824-14d522374fe2,fb5fd1fe-2963-4e2f-a3f2-55a528399f06,ed90ce1d-7ee3-4e5c-bb6c-e7b5deff6a49,f1ef9007-7cdf-4e41-bd5c-70f00b15d262,48f70093-d5f1-4fb9-979c-47772151fdf5
      responses:
        '200':
          description: Asset Crypto Actions
          content:
            application/json:
              example:
                limit: 5
                offset: 0
                data:
                - lukkaCryptoActionParentId: c07c6354-47eb-4ce2-9267-fbd724c532c0
                  lukkaCryptoActionId: a93d3b3f-b3a8-4478-a2f9-fe5cdacc7224
                  announceTime: '2011-10-09T06:14:28Z'
                  effectiveTime: '2011-10-07T07:31:00Z'
                  lukkaCryptoActionCode: HFORK
                  lukkaCryptoActionName: Hard Fork
                  eventName: null
                  eventDescription: Litecoin (LTC) Hard Fork from Bitcoin (BTC)
                  eventUrl: https://bitcointalk.org/index.php?topic=47417.0
                  announceUrl: null
                  recordNote: 'Litecoin will come with 150 premined coins: just the genesis block and the first 2 blocks to confirm the genesis is valid.  We believe a coin needs to be released in a fair manner.  Having one person (or a group) control a large amount of coins that can be used as they see fit is against the decentralized vision of Bitcoin.  Yes, it is true that without a stash of premined coins, we will not be able to afford to pay for bounties, but we believe people will see the virtue of this coin, invest in it as early adopters, and will be willing to spend time creating services to make this coin better.'
                  isFutureEvent: false
                - lukkaCryptoActionParentId: 2c4aa1ad-82d6-46a8-b143-d8fd024dea63
                  lukkaCryptoActionId: 000a15f4-1ef0-4f0c-8245-0e28d71547d5
                  announceTime: '2014-02-28T00:00:00Z'
