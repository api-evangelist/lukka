  /v2/lukka/markets/LM47PH5UBV0:
    get:
      operationId: aMarketplaceAndItsDetails
      summary: A Marketplace and its Details
      tags:
      - Reference Data - Marketplace Terms and Conditions
      description: "Get all known details for a given Lukka Marketplace Identifier from the Lukka Marketplace Reference Data (\"LMPRD\") Product\n\n Lukka Marketplace Data provides information about cryptocurrency marketplaces (i.e. an exchange or other marketplace such as OTC trading desks). The dataset provides its users information about the market type, legal entities, location, applicable regulatory licenses, compliance, certifications, technology, trading details, operating status, successor markets and various information about a marketplace.\n\n Marketplaces that are eligible to be tracked within the Lukka Marketplace Reference Data are trading venues where transactions in cryptocurrencies take place. Such transactions include venues where cryptocurrencies, or derivatives of those cryptocurrencies, can be bought, sold, lent, borrowed or swapped for other cryptocurrencies or fiat currencies. Venue types include, but are not limited to: Centralized Exchanges, Decentralized Exchanges, Exchange Aggregators or Relayers, Lending Platforms, Over-The-Counter Desks or Brokers.\n\n Response Details \n\n Field Name Data Type Description name STRING Lukka's long name for the entity"
      responses:
