        \ be bought, sold, lent, borrowed or swapped for other cryptocurrencies or fiat currencies. Venue types include, but\
        \ are not limited to: Centralized Exchanges, Decentralized Exchanges, Exchange Aggregators or Relayers, Lending Platforms,\
