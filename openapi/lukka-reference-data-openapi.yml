  /v2/lukka/custodians:
    get:
      operationId: allCustodians
      summary: All Custodians
      tags:
      - Reference Data - Custodian Terms and Conditions
      description: "Lukka Custodian Data provides information about digital asset custodians. The dataset provides its users\
        \ information about the legal entities, location, applicable regulatory licenses, compliance, certifications, security\
        \ provisions, operating status, successor entities and other various information about a custodian.\n\n Custodians\
        \ that are eligible to be tracked within the Lukka Custodian Reference Data (“LCRD”) are custodians that provide custody\
        \ services for digital assets."
      parameters:
      - name: expandDetails
        in: query
        required: false
        schema:
          type: string
        example: '[ALL]'
      responses:
        '200':
          description: All Custodians
