        \ (\"LMPRD\") Product\n\n Lukka Marketplace Data provides information about cryptocurrency marketplaces (i.e. an exchange\
        \ or other marketplace such as OTC trading desks). The dataset provides its users information about the market type,\
        \ legal entities, location, applicable regulatory licenses, compliance, certifications, technology, trading details,\
        \ operating status, successor markets and various information about a marketplace.\n\n Marketplaces that are eligible\
        \ to be tracked within the Lukka Marketplace Reference Data are trading venues where transactions in cryptocurrencies\
