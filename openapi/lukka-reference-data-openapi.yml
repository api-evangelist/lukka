  /v2/lukka/assets/LA3YA6GC8Y5:
    get:
      operationId: aLukkaAssetAndItsDetails
      summary: A Lukka Asset and its Details
      tags:
      - Reference Data - Asset Terms and Conditions
      description: "The Lukka Reference Data (“LRD”) product is a comprehensive security master for digital assets. LRD is\
        \ designed to fulfill the global digital asset community’s need for an institutional-grade, clean, reliable, comprehensive,\
        \ standardized and normalized data source for digital asset reference data. Furthermore, LRD provides a means to conduct\
        \ a multitude of digital asset investment activities including: researching trading strategies, quantitative research,\
        \ benchmark construction, portfolio performance measurement and evaluation, pre and post-trade analysis and risk management\
        \ assessments.\n\n The dataset is comprised of what is commonly referred to as “Terms & Conditions” in traditional\
        \ finance. The dataset provides its users information regarding the asset type, the asset’s structure, participants,\
        \ how the supply is determined, underlying asset information (if applicable) and other various pieces of reference\
        \ data. In total, the dataset tracks over 100 fields for its users.\n\n Digital assets and derivative products on\
        \ digital assets are eligible for addition to the Lukka Reference Data product."
      responses:
        '200':
          description: A Lukka Asset and its Details
