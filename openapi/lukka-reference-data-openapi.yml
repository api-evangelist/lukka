  /v2/lukka/assets/mappings:
    get:
      operationId: assetMappings
      summary: Asset Mappings
      tags:
      - Reference Data - Mapping and Normalization
      description: "Get the cross reference of all the assets supported by an entity as a part of the Lukka Mapping Data Product\
        \ (“LMAP”)\n\n The digital asset ecosystem consists of hundreds of various platforms and service providers, each having\
        \ their own naming conventions, asset identifiers, notification processes (or lack thereof) and delivery mechanisms\
        \ (or lack thereof). The absence of standard identifiers across the ecosystem presents challenges to properly identify\
        \ and compare data across the digital asset ecosystem, especially at scale.\n\n The Lukka Mapping Data Product is\
        \ a comprehensive mapping and normalization dataset that can be leveraged to easily take the unstandardized, inconsistent\
        \ and uncleansed data from trading venues, custodians, wallets, lending platforms or other entities within the ecosystem\
        \ and normalize the data to one consistent, standardized, cleansed and timelined data record. \n\n LMAP is designed\
        \ to fulfill the need for a mechanism to facilitate an easy way to compare assets and their respective market data,\
        \ across any platform, for use in front, middle and back office processes. The product provides its users a significant\
        \ reduction in time and effort preparing data and provides its users with more time to analyze and use the data."
      parameters:
      - name: limit
        in: query
        required: false
        schema:
          type: string
        example: '100'
      - name: offset
        in: query
        required: false
        schema:
          type: string
        example: '0'
      - name: mappingStatus
        in: query
        required: false
        schema:
          type: string
        example: Active
      responses:
        '200':
          description: Asset Mappings
