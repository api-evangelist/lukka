      tags:
      - Pricing
      description: "Description: Get the price as of the given timestamp from the given pair codes. If pairCodes is left blank,\
        \ then all pairCodes will be listed for given sourceID.\n\n Keep in mind of the 2048 character limit in a GET request.\
        \ The pairCodes query parameters should only be used to get a small sub-set of prices. Otherwise use default, which\
        \ is ALL pairs.\n\n sourceId must match the 6xxx (indices) range. Default lookback is 5400000 ms (90 min)."
      parameters:
      - name: sourceId
