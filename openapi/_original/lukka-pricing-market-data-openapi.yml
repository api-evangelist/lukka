  /v2/market-data/slippage/pairs/{pairCode}:
    get:
      operationId: getSlippageByPair
      summary: Get Slippage by Pair
      tags:
      - Market Data - Spot
      description: "This endpoint calculates estimated market slippage for a given trading pair based on live order book snapshots.\
        \ It simulates walking the order book for both a buy and a sell of the requested trade size, returning VWAP-based\
        \ slippage metrics relative to the mid-price or best bid/ask. One result is returned per snapshot found within a 1-6\
        \ minute lookback window for the requested timestamp.\n\n Lukka canonical pair code is required, must end in -USD."
      parameters:
      - name: pairCode
        in: path
        required: true
        schema:
          type: string
        description: pairCode path parameter
      - name: tradeSizeValue
        in: query
        required: false
        schema:
          type: string
        example: '1000000'
      - name: tradeSizeDenom
        in: query
        required: false
        schema:
          type: string
        example: COUNTER
      - name: basis
        in: query
