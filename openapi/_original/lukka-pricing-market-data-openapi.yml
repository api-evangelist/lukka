  /v1/pricing/sources/{sourceId}/indices/historical:
    get:
      operationId: getHistoricalIndexPrices
      summary: Get Historical Index Prices
      tags:
      - Pricing
      description: "Description: Get the price history for a single pair.\n\n If the response exceeds the maximum number of\
        \ records that can be returned in a single payload, then a nextPageUrl field will be returned at the end of the response.\
        \ The nextPageUrl is used to paginate the response and can be called to request the next batch of records prior to\
        \ what was returned.\n\n sourceId must match the 6xxx (indices) range."
      parameters:
      - name: sourceId
        in: path
        required: true
        schema:
          type: string
        description: sourceId path parameter
      - name: from
        in: query
        required: false
        schema:
          type: string
        example: '2026-04-20T12:00:00Z'
      - name: to
        in: query
