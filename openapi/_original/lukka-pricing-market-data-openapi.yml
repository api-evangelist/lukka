  /v1/market-data/derivative/sources/{sourceId}/trades:
    get:
      operationId: getLatestDerivativeTrades
      summary: Get Latest Derivative Trades
      tags:
      - Market Data - Derivatives
      description: "Description: Get the Latest Trades for derivative instruments from a specific Source ID.\n\n If the response\
        \ exceeds the maximum number of records that can be returned in a single payload, then a nextPageUrl field will be\
        \ returned at the end of the response. The nextPageUrl is used to paginate the response and can be called to request\
        \ the next batch of records prior to what was returned.\n\n lookback is specified in minutes (not milliseconds)."
      parameters:
      - name: sourceId
        in: path
        required: true
        schema:
          type: string
        description: sourceId path parameter
      - name: lookback
        in: query
        required: false
        schema:
          type: string
        example: '60'
      responses:
        '200':
          description: Get Latest Derivative Trades
  /v1/market-data/derivative/sources/{sourceId}/trades/historical:
    get:
      operationId: getHistoricalDerivativeTrades
      summary: Get Historical Derivative Trades
      tags:
      - Market Data - Derivatives
      description: 'Description: Get the trade history for a specific derivative instrument from a specified Source ID. Must
        supply either entityDerivativeCode (exchange-native code) or lukkaDerivativeCode (Lukka canonical code).'
      parameters:
      - name: sourceId
        in: path
        required: true
        schema:
          type: string
        description: sourceId path parameter
      - name: from
        in: query
        required: false
        schema:
          type: string
        example: '2026-04-20T12:00:00Z'
      - name: to
        in: query
        required: false
        schema:
          type: string
        example: '2026-04-20T12:01:00Z'
      - name: entityDerivativeCode
        in: query
        required: false
        schema:
          type: string
        example: BTCUSDT
      responses:
        '200':
          description: Get Historical Derivative Trades
  /v1/pricing/sources/{sourceId}/markprices:
    get:
      operationId: getLatestMarkPrices
      summary: Get Latest Mark Prices
      tags:
      - Market Data - Derivatives
      description: 'Description: Get the latest derivative mark prices as of the given timestamp from a specified derivatives
        exchange Source ID (e.g. 4005 Binance futures). Optional underlyingAssetCode and lukkaDerivativeCode filters can be
        applied to narrow the response.'
      parameters:
      - name: sourceId
        in: path
        required: true
        schema:
          type: string
        description: sourceId path parameter
      - name: lookback
        in: query
        required: false
        schema:
          type: string
        example: '60000'
      responses:
        '200':
          description: Get Latest Mark Prices
  /v1/pricing/sources/{sourceId}/{baseAssetCode}/markprices/historical:
    get:
      operationId: getHistoricalMarkPrices
      summary: Get Historical Mark Prices
      tags:
      - Market Data - Derivatives
      description: "Description: Get the mark price history for a specific derivative instrument from a specified Source ID.\n\
        \n If the response exceeds the maximum number of records that can be returned in a single payload, then a nextPageUrl\
        \ field will be returned at the end of the response. The nextPageUrl is used to paginate the response and can be called\
        \ to request the next batch of records prior to what was returned.\n\n interval (milliseconds) allowed values: 1000,\
        \ 5000, 30000, 60000, 300000, 1800000, 3600000, 86400000."
      parameters:
      - name: sourceId
        in: path
        required: true
        schema:
          type: string
        description: sourceId path parameter
      - name: baseAssetCode
        in: path
        required: true
        schema:
          type: string
        description: baseAssetCode path parameter
      - name: from
        in: query
        required: false
        schema:
          type: string
        example: '2026-04-20T12:00:00Z'
      - name: to
        in: query
        required: false
        schema:
          type: string
        example: '2026-04-20T12:10:00Z'
      - name: interval
