        \ unique Lukka ID (LID) for the counter asset. Please refer to the Lukka ID document for more information \n \n \n\
        \ lukka_asset_two_code \n CHARACTER \n 256 \n Lukka normalized unique asset code (ticker) for the counter asset \n\
        \ \n \n lukka_asset_two_name \n CHARACTER \n 256 \n Lukka's long name for the counter asset \n \n \n start_time \n\
        \ DATE \n ISO 8601 \n Timestamp (UTC+0) when the entity pair was mapped to the Lukka pair \n \n \n end_time \n DATE\
