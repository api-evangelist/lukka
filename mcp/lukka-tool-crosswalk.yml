source:
- mcp/lukka-mcp.yml
- openapi/ (converted from https://apidocs.lukka.tech/)
description: Binds each Lukka MCP tool to the REST operation(s) that back it, and records where the MCP surface and the
  REST surface diverge. Lukka ships four MCP products (AML, on-chain/UDA, News, and most of Prediction Markets) that
  have no public REST contract at all, and a REST surface (bulk CSV extracts, the valuation service, staking, funding
  and mark prices) that no MCP tool reaches.
surfaces:
  openapi:
    files:
    - openapi/lukka-analytics-openapi.yml
    - openapi/lukka-pricing-market-data-openapi.yml
    - openapi/lukka-reference-data-openapi.yml
    - openapi/lukka-reference-data-v1-openapi.yml
    - openapi/lukka-valuation-openapi.yml
    operations: 91
    note: Converted by API Evangelist from the Postman collections Lukka publishes; Lukka does not publish OpenAPI.
  mcp:
    servers: 7
    tools: 69
    gated: true
    note: tools/list returns HTTP 401 Missing Bearer token on all seven servers; tool names and input schemas are taken
      from Lukka's published per-tool parameter tables in lukkatech/lukka-mcps.
  asyncapi:
    file: asyncapi/lukka-market-data-streaming-asyncapi.yml
    channels: 12
    note: WebSocket streaming surface; no MCP tool and no REST operation covers the streaming channels.
  graphql: null
