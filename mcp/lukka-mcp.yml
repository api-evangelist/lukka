      - address
  - name: get_address_transactions
    description: Transaction history for an address. **Returns:** a transaction list at the requested verbosity.
    inputSchema:
      type: object
      properties:
        blockchain:
          type: string
          description: Lowercase chain symbol
        address:
          type: string
          description: Wallet address
        verbose:
          type: string
          description: '`0` = hashes only, `1` = key details (default), `2` = full decoded objects (use small `limit`)'
        limit:
          type: string
          description: 1-1000, default 50
        get_newest:
          type: string
          description: Newest-first (mutually exclusive with range filters)
        asset:
          type: string
          description: Filter by a specific asset
      required:
      - blockchain
      - address
  - name: Get_transaction_for_txhash
    description: Full decoded detail for a single transaction.
    inputSchema:
      type: object
      properties:
        blockchain:
          type: string
          description: Lowercase chain symbol
        txhash:
          type: string
          description: Transaction hash
      required:
      - blockchain
      - txhash
- name: Lukka-Analytics
  url: https://analytics.mcp.lukka.tech
  transport: http
  description: Implied forward rate curves, options volatility surfaces, OTC FX rates
  access: read-only
  authentication:
    type: oauth2
    flow: authorization_code + PKCE
    dynamic_client_registration: true
    protected_resource_metadata: https://analytics.mcp.lukka.tech/.well-known/oauth-protected-resource
    authorization_server: https://auth0.lukka.tech
    scopes:
    - mcp
    note: RFC 9728 protected-resource discovery; no static client id or secret. Requires a Lukka account with entitlement
      for the product.
  docs: https://github.com/lukkatech/lukka-mcps/blob/main/docs/lukka-analytics-mcp/README.md
  tool_count: 3
  tools:
  - name: getImpliedRates
    description: Implied interest rate term structure from futures/swaps markets. **Returns:** per-tenor rates (`1D`..`1Y`)
      with metadata; NSS model rows also include lambda/beta curve-fit params.
    inputSchema:
      type: object
      properties:
        pairCode:
          type: string
          description: Lukka pair, e.g. `XBT-USD` (must be a pair you have access to)
        lukkaEntityCode:
          type: string
          description: Entity/source, e.g. `LUKKA`, `BINANCE`, `COINBASE`, `KRAKEN`
        curveType:
          type: string
          description: Maps to curve type, e.g. `INST_FWD`, `ZERO`, `PAR`
        source:
          type: string
          description: Rate source, e.g. `FUTURES`, `SWAPS`, `ALL`
        rateType:
          type: string
          description: Rate type, e.g. `BASIS`, `COMPOSITE`
        modelType:
          type: string
          description: '`MC` (Monte Carlo, default) or `NSS` (Nelson-Siegel-Svensson)'
          x-published-type: string enum
        timeFrom:
          type: string
          description: Window start
        timeTo:
          type: string
          description: Window end
        timeRange:
          type: string
          description: Relative window shorthand (anchor with timeFrom/timeTo)
        dataShape:
          type: string
          description: '`flat` (default) or `2L` (tenors nested under `impliedRates`)'
          x-published-type: string enum
        offset:
          type: integer
          description: Pagination offset
      required:
      - pairCode
      - lukkaEntityCode
      - curveType
      - source
      - rateType
  - name: getImpliedRatesOtcFx
    description: OTC FX rate data. **Returns per record:** `lukkaEntityCode`, `pairCode`, `businessTime`, `tenorType`,
      `tenor`, `fixedEndTime`, `underlyingPrice`, `basisPrice`/`basisBidPrice`/`basisAskPrice`, `price`/`bidPrice`/`askPrice`,
      `tradeCount`, `volume`, `bidAskSpread`, `staleness`.
    inputSchema:
      type: object
      properties:
        pairCode:
          type: string
          description: Trading pair filter, e.g. `XBT-USD`
        lukkaEntityCode:
          type: string
          description: Entity filter, e.g. `LUKKA`
        timeFrom:
          type: string
          description: Window start
        timeTo:
          type: string
          description: Window end
        timeRange:
          type: string
          description: Relative window shorthand (anchor with timeFrom/timeTo)
        dataShape:
          type: string
          description: '`flat`, `2L`, or `3L`'
          x-published-type: string enum
        offset:
          type: integer
          description: Pagination offset
  - name: getImpliedVolatilitySurface
    description: Options implied volatility surface, by delta or strike. **Returns per point:** business time, entity,
      underlying, `tenor`, `tenorNumericYearFraction`, `gridLabel`, `impliedVolatility`, plus (delta) `riskReversal`/`butterfly`/`gridLabelNumericCall`/`gridLabelNumericPut`
      or (strike) `gridLabelNumericRelStrike`.
    inputSchema:
      type: object
      properties:
        lukkaEntityCode:
          type: string
          description: Entity that sourced the surface, e.g. `LUKKA`
        underlyingAssetLukkaCode:
          type: string
          description: Underlying Lukka asset code, e.g. `XBT`, `ETH`
        moneyness:
          type: string
          description: '`delta` (grid labels are put/call deltas) or `strike` (relative strike)'
          x-published-type: string enum
        tenor:
          type: string
          description: Filter to a tenor, e.g. `1W`, `1M`, `3M`
        grid_label:
          type: string
          description: Moneyness label filter, e.g. `25D`
        timeFrom:
          type: string
          description: Window start
        timeTo:
          type: string
          description: Window end
        timeRange:
          type: string
          description: Relative window shorthand (anchor with timeFrom/timeTo)
        dataShape:
          type: string
          description: '`flat`, `2L`, or `3L`'
          x-published-type: string enum
      required:
      - lukkaEntityCode
      - underlyingAssetLukkaCode
      - moneyness
- name: Lukka-News
  url: https://news.mcp.lukka.tech
  transport: http
  description: AI-curated digital asset news search and daily summaries
  access: read-only
  authentication:
    type: oauth2
    flow: authorization_code + PKCE
    dynamic_client_registration: true
    protected_resource_metadata: https://news.mcp.lukka.tech/.well-known/oauth-protected-resource
    authorization_server: https://auth0.lukka.tech
    scopes:
    - mcp
    note: RFC 9728 protected-resource discovery; no static client id or secret. Requires a Lukka account with entitlement
      for the product.
  docs: https://github.com/lukkatech/lukka-mcps/blob/main/docs/lukka-news-mcp/README.md
  tool_count: 2
  tools:
  - name: getNews
    description: Full-text news search. **Returns:** a JSON array of NewsItem objects (total match count in the
      `X-Total-Count` response header). All parameters are optional - omitting all returns the most recent articles.
    inputSchema:
      type: object
      properties:
        keyword:
          type: string
          description: Free-text search across title and snippet
        publishDateFrom:
          type: string
          description: '**Full ISO 8601 with a time component**, e.g. `2026-04-01T00:00:00Z`. A bare date (`2026-04-01`)
            is rejected.'
        publishDateTo:
          type: string
          description: Same format constraint; must be after `publishDateFrom`
        entityCodes:
          type: string
          description: Comma-separated publisher codes, e.g. `theblock,coindesk`
        primaryCategory:
          type: string
          description: Comma-separated categories - see list below
        sentiment:
          type: string
          description: '`positive`, `negative`, `neutral`, `mixed`'
          x-published-type: string enum
        industrySegment:
          type: string
          description: e.g. `defi`, `trading`
        technicalLevel:
          type: string
          description: '`beginner`, `intermediate`, `advanced`, `expert`, `mixed`'
          x-published-type: string enum
        source:
          type: string
          description: Publisher source name
        newsID:
          type: string
          description: Fetch one article by UUID (ignores all other filters)
        sortBy:
          type: string
          description: '`date` (default), `source`, `sentiment`, `category`, `qualityScore`, `relevanceScore`'
          x-published-type: string enum
        sortOrder:
          type: string
          description: '`asc` / `desc` (default `desc`)'
          x-published-type: string enum
        limit:
          type: integer
          description: Max per page; API hard cap 500
        offset:
          type: integer
          description: Zero-based pagination offset
  - name: getDailySummaries
    description: AI-generated daily news digests. **Returns:** per-day summary date, article count, overall sentiment
      and breakdown, summary text, key themes, notable events, top categories, and top assets.
    inputSchema:
      type: object
      properties:
        date:
          type: string
          description: Single-day lookup. Mutually exclusive with `limit`. First available date is 2026-04-08.
        limit:
          type: integer
          description: Most recent N summaries. Default 14, max 90. Ignored when `date` is supplied.
- name: Lukka-Predmar
  url: https://predmar.mcp.lukka.tech
  transport: http
  description: Prediction market data from Polymarket, Kalshi and Gemini
  access: read-only
  authentication:
    type: oauth2
    flow: authorization_code + PKCE
    dynamic_client_registration: true
    protected_resource_metadata: https://predmar.mcp.lukka.tech/.well-known/oauth-protected-resource
    authorization_server: https://auth0.lukka.tech
    scopes:
    - mcp
    note: RFC 9728 protected-resource discovery; no static client id or secret. Requires a Lukka account with entitlement
      for the product.
  docs: https://github.com/lukkatech/lukka-mcps/blob/main/docs/lukka-predmar-mcp/README.md
  tool_count: 11
  tools:
  - name: GetPredictionMarkets
    description: Primary discovery endpoint - paginated event-level markets with nested outcome snapshots (prices,
      volume, open interest). **Returns:** events with outcome probabilities, volumes, and PMCS classification.
    inputSchema:
      type: object
      properties:
        search:
          type: string
          description: Free-text query across market/event names
        event_ticker:
          type: string
          description: Exact event identifier for a direct lookup
        entity_code:
          type: string
          description: 'Exchange filter: `KALSHI`, `POLYMARK`, `GMNI`'
        status:
          type: string
          description: Market status, e.g. `Open`
        outcome_type:
          type: string
          description: '`Binary` or `Multi`'
        pmcs_category:
          type: string
          description: Top-level PMCS category code (e.g. `SCI`, `GEO`, `MKT`, `SPT`, `SOC`, `OTH`)
        pmcs_supersector:
          type: string
          description: PMCS supersector code (e.g. `POL`, `SOC`, `WX`, `CRY`, `AIT`)
        sort_by:
          type: string
          description: e.g. `total_volume_usd_1hr`, `total_volume_24hr`, `total_open_interest_usd`, `end_ts`
        sort_dir:
          type: string
          description: '`asc` or `desc`'
        limit:
          type: string
          description: Max events
        offset:
          type: string
          description: Pagination offset
  - name: GetSimilarMarkets
    description: Semantically similar markets for a source event - cross-venue matching and recommendations.
    inputSchema:
      type: object
      properties:
        event_ticker:
          type: string
          description: Source event (from `GetPredictionMarkets`)
        limit:
          type: string
          description: Max similar events
        offset:
          type: string
          description: Pagination offset
      required:
      - event_ticker
      - limit
      - offset
  - name: GetPredictionMarketsTaxonomy
    description: Returns the valid PMCS taxonomy dictionary (all hierarchy levels). Call before using `pmcs_*` filters.
    inputSchema:
      type: object
      properties: {}
  - name: GetPMCSstats
    description: Nested PMCS statistics and counts for currently indexed markets - faceted navigation / dashboards.
    inputSchema:
      type: object
      properties: {}
  - name: GetMarketOverview
    description: Time-bucketed activity across exchanges - one row per bucket per exchange with `entityCode`, `entityName`,
      `sourceId`, `volumeUsd`, `tradeCount`, `volume`.
    inputSchema:
      type: object
      properties:
        from:
          type: string
          description: Window start
        to:
          type: string
          description: Window end
        interval:
          type: string
          description: Bucket size, e.g. `300000` or `3600000`
      required:
      - from
      - to
      - interval
  - name: GetOpenInterest
    description: Time-bucketed open interest across exchanges - rows keyed by time/sourceId/entity, with `openInterestUsd`.
    inputSchema:
      type: object
      properties:
        from:
          type: string
          description: Window start
        to:
          type: string
          description: Window end
        interval:
          type: string
          description: Bucket size
      required:
      - from
      - to
      - interval
  - name: GetPredictionMarketTotalVolume
    description: Time-bucketed total market volume trendline (lighter than `GetMarketOverview`).
    inputSchema:
      type: object
      properties:
        from:
          type: string
          description: Window start
        to:
          type: string
          description: Window end
        interval:
          type: string
          description: Bucket size
      required:
      - from
      - to
      - interval
  - name: GetMarketRecap
    description: Short natural-language recap of recent market activity plus summary metrics (`predictionVolume24h`,
      `newsCount`, generated-at timestamp). Returns an array of narrative paragraphs.
    inputSchema:
      type: object
      properties: {}
  - name: GetMarketNews
    description: Recent prediction-market news within a publish-date window (industry segment fixed to prediction-markets;
      internal quality/relevance thresholds applied).
    inputSchema:
      type: object
      properties:
        publishDateFrom:
          type: string
          description: Inclusive window start
        publishDateTo:
          type: string
          description: Inclusive window end
      required:
      - publishDateFrom
      - publishDateTo
  - name: GetExchanges
    description: Prediction market venues / entity metadata, including VASP classification detail.
    inputSchema:
      type: object
      properties:
        limit:
          type: string
          description: Max exchanges
        offset:
          type: string
          description: Pagination offset
        primary_location:
          type: string
          description: Location filter
        vasp_classification:
          type: string
          description: VASP classification filter
        vasp_score:
          type: string
          description: Exact VASP score
      required:
      - limit
      - offset
  - name: GetPriceHistory
    description: Historical pricing for one market on one exchange. **Returns:** OHLC candle buckets.
    inputSchema:
      type: object
      properties:
        event:
          type: string
          description: Event ticker or market identifier (from `GetPredictionMarkets`)
        exchangeId:
          type: string
          description: 'Numeric exchange ID: `4141`=Kalshi, `4137`=Polymarket, `4008`=Gemini - must match the event''s
            own exchange'
        from:
          type: string
          description: Window start
        to:
          type: string
          description: Window end
        interval:
          type: string
          description: Bucket size, e.g. `300000` (5-min)
        limit:
          type: string
          description: Max buckets, e.g. `288` for 24h of 5-min candles
      required:
      - event
      - exchangeId
