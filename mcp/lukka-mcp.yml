    inputSchema:
      type: object
      properties:
        lukkaDerivativeLid:
          type: string
          description: e.g. `L-BINA-PERP-UNI-USD`
      required:
      - lukkaDerivativeLid
  - name: get_reference_derivatives
    description: Canonical reference derivative data.
    inputSchema:
      type: object
      properties:
        limit:
          type: integer
          description: Default 100
        offset:
          type: integer
          description: Pagination offset
- name: Lukka-AML
  url: https://aml.mcp.lukka.tech
  transport: http
  description: AML risk scoring and compliance reports across 108+ blockchains, OFAC sanctions detection
  access: read-only
  authentication:
    type: oauth2
    flow: authorization_code + PKCE
    dynamic_client_registration: true
    protected_resource_metadata: https://aml.mcp.lukka.tech/.well-known/oauth-protected-resource
    authorization_server: https://auth0.lukka.tech
    scopes:
    - mcp
    note: RFC 9728 protected-resource discovery; no static client id or secret. Requires a Lukka account with entitlement
      for the product.
  docs: https://github.com/lukkatech/lukka-mcps/blob/main/docs/lukka-aml-mcp/README.md
  tool_count: 4
  tools:
  - name: generateAmlScoringReport
    description: Light risk check - available on every supported chain. **Returns:** a numeric risk score (0-100),
      a categorical risk level (LOW/MEDIUM/HIGH), and the top risk indicators triggered (if any). A clean address
      with no history typically scores ~33 (MEDIUM) - that is the baseline, not a risk signal. Small response.
    inputSchema:
      type: object
      properties:
        address:
          type: string
          description: The bare wallet address, e.g. `0x1234...`. Pass the address only - do not append phrases
            like "on Ethereum".
        address_type:
          type: string
          description: Blockchain protocol code, e.g. `BTC`, `ETH`, `TRX`, `SOL`.
      required:
      - address
      - address_type
  - name: generateAmlSimplifiedReport
    description: Light report tier for chains not covered by Standard/Enhanced (see chain list below). Small response.
    inputSchema:
      type: object
      properties:
        address:
          type: string
          description: The bare wallet address, e.g. `0x1234...`. Pass the address only - do not append phrases
            like "on Ethereum".
        address_type:
          type: string
          description: Blockchain protocol code, e.g. `BTC`, `ETH`, `TRX`, `SOL`.
      required:
      - address
      - address_type
  - name: generateAmlStandardReport
    description: Full compliance report with detailed risk factor and counterparty exposure analysis. **Returns:**
      risk score/level plus a full breakdown of triggered indicators, counterparty exposure, and (where available)
      an owner/entity profile. Response is 300-500 KB.
    inputSchema:
      type: object
      properties:
        address:
          type: string
          description: The bare wallet address, e.g. `0x1234...`. Pass the address only - do not append phrases
            like "on Ethereum".
        address_type:
          type: string
          description: Blockchain protocol code, e.g. `BTC`, `ETH`, `TRX`, `SOL`.
      required:
      - address
      - address_type
  - name: generateAmlEnhancedReport
    description: Deepest available analysis, on the same chain list as Standard. Response is 500 KB+.
    inputSchema:
      type: object
      properties:
        address:
          type: string
          description: The bare wallet address, e.g. `0x1234...`. Pass the address only - do not append phrases
            like "on Ethereum".
        address_type:
          type: string
          description: Blockchain protocol code, e.g. `BTC`, `ETH`, `TRX`, `SOL`.
      required:
      - address
      - address_type
- name: Lukka-UDA
  url: https://uda.mcp.lukka.tech
