  - name: Get_newest_block_blockheight
    description: Latest block height for a chain (legacy v1).
    inputSchema:
      type: object
      properties:
        blockchain:
          type: string
          description: Lowercase chain symbol, e.g. `btc`, `eth`, `sol`
      required:
      - blockchain
  - name: get_block
    description: Block information with transaction hashes. **Returns:** block metadata plus a transaction list
      (hashes, or full decoded objects at higher verbosity).
