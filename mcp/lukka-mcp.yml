  docs: https://github.com/lukkatech/lukka-mcps/blob/main/docs/lukka-uda-mcp/README.md
  tool_count: 8
  tools:
  - name: Get_newest_block_blockheight_v2
    description: Latest block height (and hash) for a chain - preferred version.
    inputSchema:
      type: object
      properties:
        blockchain:
          type: string
          description: Lowercase chain symbol, e.g. `eth`
        status:
