- name: Lukka Market Data Streaming API
  description: WebSocket streaming for executed trades, Level-1 order-book quotes, Lukka Prime pricing, Lukka Index valuations,
    Standard and Median Reference Rates, real-time MVWAP, derivative Greeks and prediction-market trades and quotes. Twelve
    channels across six hosts, authenticated with the same Okta JWT passed as an access_token query parameter and reauthorized
    in-band.
  humanURL: https://apidocs.lukka.tech/
  baseURL: wss://market-data-ws.lukka.tech
