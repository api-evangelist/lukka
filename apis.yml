- name: Lukka MCP Servers
  description: Seven first-party hosted Model Context Protocol servers exposing 69 read-only tools over Lukka pricing, reference
    data, AML risk scoring, on-chain data, analytics, news intelligence and prediction markets. Streamable HTTP with OAuth
    2.0 authorization code + PKCE and Dynamic Client Registration; documented for Claude Code, Claude Desktop, Claude Cowork,
    the ChatGPT app and OpenAI Codex CLI. AML, on-chain and news are MCP-only - they have no public REST contract.
  humanURL: https://github.com/lukkatech/lukka-mcps
  baseURL: https://pricing.mcp.lukka.tech
