apis:
- name: Lukka Market Data Streaming API
  description: >-
    WebSocket streaming for executed trades, Level-1 order-book quotes, Lukka Prime pricing, Lukka Index
    valuations, Standard and Median Reference Rates, real-time MVWAP, derivative Greeks and prediction-market
    trades and quotes. Twelve channels across six hosts, authenticated with the same Okta JWT passed as
    an access_token query parameter and reauthorized in-band.
  humanURL: https://apidocs.lukka.tech/
  baseURL: wss://market-data-ws.lukka.tech
  tags:
  - Streaming
  - Market Data
  - WebSocket
  - Crypto
  properties:
  - type: AsyncAPI
    url: asyncapi/lukka-market-data-streaming-asyncapi.yml
  - type: Documentation
    url: https://apidocs.lukka.tech/
- name: Lukka MCP Servers
  description: >-
    Seven first-party hosted Model Context Protocol servers exposing 69 read-only tools over Lukka pricing,
    reference data, AML risk scoring, on-chain data, analytics, news intelligence and prediction markets.
    Streamable HTTP with OAuth 2.0 authorization code + PKCE and Dynamic Client Registration; documented
    for Claude Code, Claude Desktop, Claude Cowork, the ChatGPT app and OpenAI Codex CLI. AML, on-chain
    and news are MCP-only - they have no public REST contract.
  humanURL: https://github.com/lukkatech/lukka-mcps
  baseURL: https://pricing.mcp.lukka.tech
  tags:
  - MCP
  - Artificial Intelligence
  - Agents
  - Crypto
  tags_raw:
  - MCP
  - AI
  - Agents
  - Crypto
