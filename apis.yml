aid: lukka
name: Lukka
description: Lukka is an enterprise crypto data and financial software company that produces institutional-grade digital
  asset data for financial institutions, auditors, funds and corporates. Its products include Lukka Prime - the first fair-market-value
  pricing methodology for crypto assets, aligned to GAAP, IFRS and SEC guidance - plus reference rates and indices, Lukka
  Reference Data (a normalized 'golden copy' security master mapping thousands of crypto assets across hundreds of exchanges,
  custodians and VASPs), market data, derivatives analytics, AML risk scoring across 108+ blockchains, on-chain data, news
  intelligence and prediction markets. Data is delivered over REST, WebSocket streaming, FIX and SFTP, and - unusually for
  this sector - through seven first-party hosted Model Context Protocol (MCP) servers with an official Claude plugin, making
  Lukka one of the more agent-forward providers in the catalog. All access requires a Lukka account and per-product entitlement;
  there is no free tier or self-service signup.
